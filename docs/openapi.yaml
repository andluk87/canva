openapi: 3.1.0
info:
  title: Forma Core API
  version: 0.4.0
  description: >-
    Session-cookie API. Project writes require matching revision; conflicts return 409.
    Mutating requests with an Origin header must match the request host or return 403.
    Public publications explicitly expose sanitized design snapshots, independently of
    project member roles. Account security secrets and recovery codes are returned
    only by their setup or rotation operations. Personal templates are private snapshots
    owned by the current account. Presentation notes and chart source metadata remain
    private when publishing a sanitized design snapshot. See README for scope limitations.
servers:
  - url: /api
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: forma_session
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Credentials:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 100 }
    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 256 }
        twoFactorCode:
          type: string
          maxLength: 100
          description: Required when TOTP is enabled. A fresh six-digit authenticator code or unused recovery code; whitespace and recovery-code hyphens are ignored.
    User:
      type: object
      required: [id, email, name, brand]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        brand: { type: object, additionalProperties: true }
    UserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    RevokedSessions:
      allOf:
        - { $ref: "#/components/schemas/Ok" }
        - type: object
          required: [revoked]
          properties:
            revoked: { type: integer, minimum: 0 }
    CurrentPassword:
      type: object
      required: [currentPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
    FactorConfirmation:
      allOf:
        - { $ref: "#/components/schemas/CurrentPassword" }
        - type: object
          required: [code]
          properties:
            code:
              type: string
              maxLength: 100
              description: Fresh six-digit TOTP or unused recovery code. Confirming initial setup accepts TOTP only. Reused TOTP time steps and consumed recovery codes are rejected.
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Ten one-use codes shown only on generation; a new set invalidates all previous recovery codes.
          items: { type: string, pattern: "^[A-F0-9]{4}(-[A-F0-9]{4}){3}$" }
    AccountSession:
      type: object
      required: [id, current, created, expires, userAgent]
      properties:
        id:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Opaque identifier for session management, not an authentication token.
        current: { type: boolean }
        created: { type: [string, "null"], format: date-time }
        expires: { type: string, format: date-time }
        userAgent: { type: string, maxLength: 300 }
    Document:
      type: object
      required: [pages]
      description: Private editable document, below 15000000 UTF-8 JSON bytes. Optional page notes and transitions are stored and synchronized with page metadata.
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id, canvas]
            properties:
              id: { type: string, minLength: 1, maxLength: 128 }
              notes:
                type: string
                maxLength: 10000
                description: Speaker notes for authorized project participants and PPTX/JSON export. Excluded from public snapshot responses.
              transition:
                type: string
                enum: [none, fade, slide]
                description: Display transition when entering this page in the Forma presentation viewer. Omission means none; not a PowerPoint animation instruction.
              canvas:
                type: object
                required: [objects]
                properties:
                  objects:
                    type: array
                    maxItems: 2000
                    items: { $ref: "#/components/schemas/FabricObject" }
                  background: { type: [string, object, "null"] }
    FabricObject:
      type: object
      required: [type]
      additionalProperties: true
      description: Serialized Fabric object. Rendering properties, groups and optional application metadata are preserved in private documents. Generic project validation checks the document envelope and object types/IDs; application tools validate their own metadata model.
      properties:
        type: { type: string }
        id: { type: string, maxLength: 128 }
        objects:
          type: array
          items: { $ref: "#/components/schemas/FabricObject" }
        formaData:
          $ref: "#/components/schemas/ChartMetadata"
    ChartMetadata:
      type: object
      required: [version, kind, chartType, title, palette, width, height, headers, rows]
      description: >-
        Application metadata attached as formaData to chart/table Fabric groups, with the
        full editable data matrix. It travels with private projects, personal templates
        and JSON exports. The data tool validates this schema before creating/updating
        a group; it is not a separate server analytics endpoint. Public snapshots strip
        formaData while retaining the group's rendered shapes and visible labels.
        Chart CSV import is limited to 100000 bytes. Row widths must match the header.
        Charts require exactly two columns (label and number); labels contain 1–100
        characters and values must parse as finite numbers with absolute value at most
        1000000000000. Pie charts allow at most 12 rows with strictly positive values.
      properties:
        version: { type: integer, const: 1 }
        kind: { type: string, enum: [chart, table] }
        chartType: { type: string, enum: [bar, line, pie] }
        title: { type: string, maxLength: 120 }
        palette: { type: string, enum: [violet, ocean, sunset] }
        width: { type: number, minimum: 40, maximum: 4000 }
        height: { type: number, minimum: 40, maximum: 4000 }
        headers:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }
        rows:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: array
            minItems: 1
            maxItems: 8
            items: { type: string, maxLength: 1000 }
    PublicDocument:
      type: object
      required: [pages]
      additionalProperties: false
      description: Sanitized public artwork only. Page notes, transitions and object formaData are omitted; rendered text and chart labels remain visible as part of the design.
      properties:
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id, canvas]
            additionalProperties: false
            properties:
              id: { type: string, description: Canonical public page identifier unrelated to the private page ID. }
              canvas:
                type: object
                required: [objects]
                properties:
                  objects:
                    type: array
                    maxItems: 2000
                    items: { $ref: "#/components/schemas/PublicFabricObject" }
                  background: { type: [string, object, "null"] }
    PublicFabricObject:
      type: object
      not:
        required: [formaData]
      additionalProperties: true
      description: Allowlisted inert Fabric properties. Arbitrary private fields and raw chart metadata are removed recursively; embedded raster images are verified and normalized to PNG.
      properties:
        type: { type: string }
        src: { type: string, pattern: "^data:image/png;base64," }
        objects:
          type: array
          items: { $ref: "#/components/schemas/PublicFabricObject" }
    ProjectInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, maxLength: 40 }
        width: { type: integer, minimum: 100, maximum: 6000, default: 1080 }
        height: { type: integer, minimum: 100, maximum: 6000, default: 1080 }
        document: { $ref: "#/components/schemas/Document" }
    ProjectUpdate:
      type: object
      required: [revision]
      properties:
        revision: { type: integer }
        title: { type: string, minLength: 1, maxLength: 200 }
        document: { $ref: "#/components/schemas/Document" }
        thumbnail:
          { type: string, description: "PNG data URI, up to 400000 characters" }
        folder: { type: string, maxLength: 100 }
        favorite: { type: boolean }
        deleted: { type: boolean }
    Project:
      allOf:
        - { $ref: "#/components/schemas/ProjectInput" }
        - type: object
          required: [id, title, kind, width, height, document, revision, role, created, updated]
          properties:
            id: { type: string }
            owner_id: { type: string }
            revision: { type: integer, minimum: 1 }
            role: { type: string, enum: [owner, editor, viewer] }
            folder: { type: string }
            favorite: { type: integer, enum: [0, 1] }
            deleted: { type: integer, enum: [0, 1] }
            thumbnail: { type: [string, "null"] }
            created: { type: string, format: date-time }
            updated: { type: string, format: date-time }
    BulkInput:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          description: >-
            UTF-8 CSV text up to 1000000 bytes, with a unique nonempty header and 1–50 data rows.
            Comma or semicolon delimiter is detected automatically. Quoted cells, escaped quotes,
            quoted newlines, CRLF and a UTF-8 BOM are supported. At most 100 columns and 20000
            characters per cell. Every row must match the header width.
          examples: ["name,city\nAnna,Moscow\nIvan,Kazan"]
        titlePattern:
          type: string
          minLength: 1
          maxLength: 1000
          description: Optional title with {{column}} placeholders. Resolved names must contain 1–200 characters; default is source title followed by row number.
          examples: ["Certificate — {{name}}"]
        mode: { type: string, enum: [projects], default: projects }
    PersonalTemplate:
      type: object
      required: [id, title, category, kind, width, height, thumbnail, pageCount, revision, created, updated]
      description: Private template summary. Documents and original project identifiers are not returned by the library listing.
      properties:
        id: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, maxLength: 60 }
        kind: { type: string, maxLength: 40 }
        width: { type: integer, minimum: 100, maximum: 6000 }
        height: { type: integer, minimum: 100, maximum: 6000 }
        thumbnail:
          type: [string, "null"]
          maxLength: 1000000
          description: Embedded PNG/JPG/WebP thumbnail when a supported source preview is available; otherwise null.
        pageCount: { type: integer, minimum: 1, maximum: 100 }
        revision: { type: integer, minimum: 1 }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    PersonalTemplateResponse:
      type: object
      required: [template]
      properties:
        template: { $ref: "#/components/schemas/PersonalTemplate" }
    PersonalTemplateInput:
      type: object
      required: [projectId, title]
      properties:
        projectId: { type: string, minLength: 1, maxLength: 128 }
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed, nonblank title without ASCII control characters.
        category:
          type: string
          maxLength: 60
          default: ""
          description: Trimmed category without ASCII control characters. An empty category is allowed.
    PersonalTemplateUpdate:
      type: object
      required: [revision]
      anyOf:
        - required: [title]
        - required: [category]
        - required: [projectId]
      properties:
        revision: { type: integer, minimum: 1, description: Current template revision; a mismatch returns 409. }
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, maxLength: 60 }
        projectId:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional replacement source project; the caller must have editor or owner access. Omitting it preserves the saved template document.
    PublicationInput:
      type: object
      description: >-
        Set at most one expiry field. Null means no expiration. Omitting both fields creates
        a nonexpiring link on POST and preserves the existing expiry on PUT. Documents and
        titles in the request are ignored; the saved server project is the snapshot source.
      not:
        required: [expiresInDays, expiresAt]
      properties:
        expiresInDays: { type: [integer, "null"], minimum: 1, maximum: 365 }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Future server time within the next 366 days, as an alternative to expiresInDays.
    PublicationLink:
      type: object
      required: [token, version, sourceRevision, url, created, updated, expiresAt, revoked, expired]
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        version: { type: integer, minimum: 1 }
        sourceRevision: { type: integer, minimum: 1 }
        url: { type: string, description: "Relative public viewer URL in the form /?view=TOKEN." }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        revoked: { type: boolean }
        expired: { type: boolean }
    PublicationLinkResponse:
      type: object
      required: [publication]
      properties:
        publication: { $ref: "#/components/schemas/PublicationLink" }
    PublicSnapshot:
      type: object
      required: [title, kind, width, height, version, created, updated, expiresAt, contentHash, document]
      properties:
        title: { type: string }
        kind: { type: string }
        width: { type: integer, minimum: 100, maximum: 6000 }
        height: { type: integer, minimum: 100, maximum: 6000 }
        version: { type: integer, minimum: 1 }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        contentHash: { type: string, pattern: "^[a-f0-9]{64}$", description: SHA-256 of the canonical stored snapshot document. }
        document: { $ref: "#/components/schemas/PublicDocument" }
  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Login required or session expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient permission, invalid current password or disallowed request Origin.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource absent or inaccessible to this account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAttempts:
      description: More than 20 sensitive account-security requests per account in one minute.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  parameters:
    projectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    publicationToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
paths:
  /health:
    get:
      security: []
      responses:
        "200": { description: API and database ready }
  /auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { description: User created and session cookie issued }
        "400": { description: Invalid fields }
        "409": { description: Email already registered }
        "429": { description: Rate limit }
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginCredentials" }
      responses:
        "200": { description: Session cookie issued }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid credentials or missing, incorrect or already consumed second factor. When a second factor is required the response includes requiresTwoFactor true; retry login with twoFactorCode.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      requiresTwoFactor: { type: boolean, const: true }
        "429": { description: Rate limit }
  /auth/me:
    get:
      responses:
        "200": { description: User profile and brand }
        "401": { description: Login required }
  /auth/logout:
    post:
      responses:
        "200": { description: Current session revoked }
  /brand:
    put:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, colors, font]
              properties:
                name: { type: string, maxLength: 100 }
                colors:
                  {
                    type: array,
                    maxItems: 10,
                    items: { type: string, pattern: "^#[0-9a-fA-F]{6}$" },
                  }
                font: { type: string, maxLength: 100 }
      responses:
        "200": { description: Brand saved }
        "400": { description: Invalid palette }
  /projects:
    get:
      responses:
        "200":
          { description: Accessible project summaries including trash and role }
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201": { description: Project created }
        "400": { description: Invalid input }
  /projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
    get:
      responses:
        "200": { description: Full document and current revision }
        "404": { description: Absent or inaccessible project }
    put:
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200": { description: New revision }
        "400": { description: Invalid document }
        "403": { description: Insufficient role }
        "409": { description: Revision conflict }
    delete:
      responses:
        "200": { description: Permanently deleted by owner }
        "403": { description: Owner required }
  /projects/{id}/members:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
    get:
      responses:
        "200": { description: Registered members and roles }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [viewer, editor] }
      responses:
        "200": { description: Owner granted or changed access }
        "403": { description: Owner required }
        "404": { description: User must register first }
  /projects/{id}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: user, in: path, required: true, schema: { type: string } }
    delete:
      responses:
        "200": { description: Access revoked }
        "403": { description: Owner required }
  /projects/{id}/versions:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
    get:
      responses:
        "200": { description: Last 30 version summaries }
  /projects/{id}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { name: version, in: path, required: true, schema: { type: string } }
    get:
      responses:
        "200":
          {
            description: Prior document and title; restore using PUT project with current revision,
          }
        "404": { description: Version absent }
  /projects/{id}/comments:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
    get:
      responses:
        "200": { description: Comments ordered by time }
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201": { description: Comment saved }
        "403": { description: Editor or owner required }
  /assets:
    get:
      responses:
        "200": { description: Current user's image library }
    post:
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  {
                    type: string,
                    format: binary,
                    description: "PNG/JPG/WebP up to 10 MB and 25 MP",
                  }
      responses:
        "201": { description: Decoded and normalized PNG stored }
        "400": { description: Invalid or oversized image }
  /assets/{asset}/file:
    parameters:
      - { name: asset, in: path, required: true, schema: { type: string } }
    get:
      responses:
        "200":
          {
            description: Owner's normalized PNG,
            content:
              { image/png: { schema: { type: string, format: binary } } },
          }
        "404": { description: Absent or inaccessible asset }

  /projects/{id}/live:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
    get:
      description: WebSocket Upgrade with same-origin session cookie. See REALTIME.md for message protocol.
      responses:
        "101": { description: WebSocket connection established }
        "401": { description: Login required }
        "403": { description: Origin rejected }
        "404": { description: Project absent or inaccessible }
        "429": { description: Connection limit }

  /account/profile:
    patch:
      summary: Change the current user's display name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed before saving. Blank names and ASCII control characters are rejected.
      responses:
        "200":
          description: Updated profile; connected collaborators receive refreshed account information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /account/password:
    post:
      summary: Change password and revoke every other session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CurrentPassword" }
                - type: object
                  required: [newPassword]
                  properties:
                    newPassword:
                      type: string
                      minLength: 10
                      maxLength: 256
                      description: Must differ from the current password.
      responses:
        "200":
          description: Password changed atomically; current session retained and other sessions revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedSessions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
  /account/sessions:
    get:
      summary: List this user's unexpired sessions without exposing authentication tokens.
      responses:
        "200":
          description: Sessions ordered by creation time, most recent first. Older migrated sessions can have a null created date.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/AccountSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /account/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: An opaque session identifier returned by GET /account/sessions.
        schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    delete:
      summary: Revoke another session belonging to the current user.
      responses:
        "200":
          description: Session revoked and its live connections lose authorization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Cannot revoke the current session here; use POST /auth/logout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /account/logout-all:
    post:
      summary: Revoke all sessions including the current session and clear the session cookie.
      responses:
        "200":
          description: All sessions revoked; subsequent authenticated requests need a new login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokedSessions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /account/security:
    get:
      summary: Read second-factor status without returning the authenticator secret or recovery codes.
      responses:
        "200":
          description: Current TOTP configuration and remaining recovery-code count.
          content:
            application/json:
              schema:
                type: object
                required: [twoFactorEnabled, enabledAt, recoveryCodesRemaining]
                properties:
                  twoFactorEnabled: { type: boolean }
                  enabledAt: { type: [string, "null"], format: date-time }
                  recoveryCodesRemaining: { type: integer, minimum: 0, maximum: 10 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /account/2fa/setup:
    post:
      summary: Start a ten-minute authenticator enrollment after current-password verification.
      description: >-
        A new call replaces any pending enrollment. TOTP uses RFC 6238 SHA-1,
        six digits and 30-second time steps. Merely starting setup does not enable
        the second factor; POST /account/2fa/confirm must verify a generated code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "200":
          description: Pending enrollment secret and authenticator URI. Response uses Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [secret, expires, otpauthUri]
                properties:
                  secret: { type: string, pattern: "^[A-Z2-7]{32}$", description: Base32 secret to enter into an authenticator; handle as sensitive data. }
                  expires: { type: string, format: date-time }
                  otpauthUri: { type: string, format: uri, description: "otpauth TOTP enrollment URI, including issuer Forma." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Second factor is already enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
  /account/2fa/confirm:
    post:
      summary: Verify pending TOTP setup, enable the second factor and issue ten recovery codes.
      description: Other sessions are revoked. The accepted TOTP time step cannot be reused for login or another sensitive second-factor operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorConfirmation" }
      responses:
        "200":
          description: TOTP enabled; keep the one-time-displayed recovery codes securely. Response uses Cache-Control no-store.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Ok" }
                  - { $ref: "#/components/schemas/RecoveryCodes" }
        "400":
          description: Enrollment absent or expired, or incorrect authenticator code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Second factor is already enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
  /account/2fa/disable:
    post:
      summary: Disable TOTP using the current password and a fresh TOTP or unused recovery code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorConfirmation" }
      responses:
        "200":
          description: Second factor, pending enrollment and recovery codes cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Incorrect current password, missing/incorrect/reused second factor, or disallowed Origin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Second factor is not enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
  /account/2fa/recovery:
    post:
      summary: Replace recovery codes after verifying the current password and a fresh second factor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorConfirmation" }
      responses:
        "200":
          description: New set of ten recovery codes; previous codes invalidated. Response uses Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Incorrect current password, missing/incorrect/reused second factor, or disallowed Origin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Second factor must be enabled first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /projects/{id}/bulk:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
    post:
      summary: Create one personalized project per CSV data row from a saved source design.
      description: >-
        Owner or editor required. Replaces {{column}} placeholders only in text properties,
        including nested groups, and in the optional titlePattern. Every referenced variable
        must have a CSV header. Preserves image URLs, styling, source project and page/object IDs
        within each separate copy. New projects belong to the calling user and inherit no
        members or publications. All rows are validated before a single atomic transaction;
        combined serialized documents may not exceed 30000000 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkInput" }
      responses:
        "201":
          description: All personalized projects created successfully; no partial batch is committed.
          content:
            application/json:
              schema:
                type: object
                required: [projects, count, variables]
                properties:
                  projects:
                    type: array
                    minItems: 1
                    maxItems: 50
                    items: { $ref: "#/components/schemas/Project" }
                  count: { type: integer, minimum: 1, maximum: 50 }
                  variables: { type: array, uniqueItems: true, items: { type: string } }
        "400":
          description: Invalid CSV, missing variable column, invalid mode/title pattern, generated document or batch size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Source project is in the trash; restore it before creating copies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/{id}/publications:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
    get:
      summary: List up to 100 recently updated public links, including expired and revoked links.
      description: Owner only. Project viewer/editor membership does not grant publication management.
      responses:
        "200":
          description: Link metadata without snapshot contents. Response uses Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [publications]
                properties:
                  publications:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/PublicationLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Explicitly publish a sanitized snapshot under a new random 256-bit token.
      description: >-
        Owner only. Captures the saved server revision, not unsaved editor state. Normalizes
        embedded PNG/JPG/WebP through sharp; rejects scripts, SVG, external resources,
        unsupported object types, excessive complexity and normalized snapshots over 18 MB.
        Private account details, members, comments, history and unrelated assets are excluded.
        Private edits do not change this snapshot until an explicit PUT publication operation.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationInput" }
      responses:
        "201":
          description: New public link and immutable version 1 snapshot created. Response uses Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationLinkResponse" }
        "400":
          description: Invalid expiry, unsafe content, unsupported image/object or snapshot complexity/size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Project is trashed, changed during snapshot processing, or already has 50 unrevoked links.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /projects/{id}/publications/{token}:
    parameters:
      - { $ref: "#/components/parameters/projectId" }
      - { $ref: "#/components/parameters/publicationToken" }
    put:
      summary: Publish a new immutable snapshot version under the existing link.
      description: Owner only. Uses the same sanitizer and saved-project revision checks as POST. Prior snapshot rows remain immutable; guests see the latest explicitly published version.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicationInput" }
      responses:
        "200":
          description: Snapshot version incremented under the same token. Response uses Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationLinkResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Project is trashed or the project/publication changed during snapshot processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Link was revoked permanently; publish a new link instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Permanently revoke the public link.
      description: Owner only. Future requests return 410; already loaded, copied or downloaded snapshots cannot be recalled.
      responses:
        "200":
          description: Link revoked. Repeating revocation of an existing link is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /publications/{token}:
    parameters:
      - { $ref: "#/components/parameters/publicationToken" }
    get:
      security: []
      summary: Read a public design snapshot without signing in.
      description: >-
        A valid unrevoked, unexpired token is sufficient. Returns snapshot pages and presentation
        metadata only, without owner identity, member list, comments, project revision history,
        speaker notes, page transition metadata, raw chart/table formaData or access to other
        private assets. Rendered chart shapes and visible labels remain part of the artwork.
        Images are verified embedded PNG data URIs. All
        responses use Cache-Control no-store, Referrer-Policy no-referrer and X-Robots-Tag
        noindex, nofollow, noarchive. Trashed and permanently deleted projects are unavailable.
      responses:
        "200":
          description: Latest explicitly published snapshot, suitable for read-only rendering.
          content:
            application/json:
              schema:
                type: object
                required: [publication]
                properties:
                  publication: { $ref: "#/components/schemas/PublicSnapshot" }
        "404":
          description: Unknown or malformed token, or source project is trashed/deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Link expired or was revoked by its owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /personal-templates:
    get:
      summary: Search the current account's private template library.
      description: >-
        Only templates owned by the current account are visible; templates have no member
        sharing or public-link API. Summaries omit documents and the original source project.
        Search is trimmed, NFKC-normalized and case-insensitive across title and category.
        Categories and usage describe the whole private library, independent of filters.
        Authenticated template responses use Cache-Control no-store.
      parameters:
        - name: q
          in: query
          description: Optional search text without ASCII control characters.
          schema: { type: string, maxLength: 200, default: "" }
        - name: category
          in: query
          description: Optional exact category match; empty string selects uncategorized templates.
          schema: { type: string, maxLength: 60 }
      responses:
        "200":
          description: Filtered private templates, all library categories and current quota usage.
          content:
            application/json:
              schema:
                type: object
                required: [templates, categories, limits, usage]
                properties:
                  templates:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/PersonalTemplate" }
                  categories:
                    type: array
                    uniqueItems: true
                    items: { type: string, maxLength: 60 }
                  limits:
                    type: object
                    required: [maxTemplates, maxStorageBytes]
                    properties:
                      maxTemplates: { type: integer, const: 100 }
                      maxStorageBytes: { type: integer, const: 52428800 }
                  usage:
                    type: object
                    required: [count, storageBytes]
                    properties:
                      count: { type: integer, minimum: 0, maximum: 100 }
                      storageBytes:
                        type: integer
                        minimum: 0
                        maximum: 52428800
                        description: UTF-8 byte count of stored template documents plus embedded thumbnails.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Save a private template snapshot from an accessible saved project.
      description: >-
        Caller needs owner or editor access to the source; viewer access is insufficient.
        Uses the saved server document and dimensions, including speaker notes and chart
        metadata. Saves an independent snapshot owned by the caller, without the source
        project's members, comments, version history or publications. Future source edits
        and deletion do not change the template. The original project is not modified.
        At most 100 templates and 52428800 bytes of documents plus thumbnails per account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalTemplateInput" }
      responses:
        "201":
          description: Private snapshot saved at template revision 1. Response uses Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalTemplateResponse" }
        "400":
          description: Invalid labels/source project identifier or unsupported source document/dimensions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Source editor/owner access required, or request Origin disallowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Source project is absent or inaccessible to this account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Saving would exceed the 100-template or 50 MiB private-library quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Source project is in the trash; restore it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /personal-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Private template identifier, not a project identifier.
        schema: { type: string }
    patch:
      summary: Rename, recategorize or replace a private template snapshot with revision checking.
      description: >-
        Only the template owner may modify it. At least one of title, category or projectId
        is required alongside the current template revision. Supplying projectId replaces
        the snapshot from a source project the caller can edit. Labels are trimmed and
        reject blank titles/control characters. Replacement is atomic and checks the
        storage quota after subtracting the existing snapshot's stored bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalTemplateUpdate" }
      responses:
        "200":
          description: Template updated and revision incremented. Response uses Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalTemplateResponse" }
        "400":
          description: Invalid/missing revision, no changes, invalid labels or invalid source snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Replacement source editor/owner access required, or request Origin disallowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Template is absent or belongs to another account, or replacement source is inaccessible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Stale template revision or replacement would exceed the 50 MiB library quota.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Replacement source project is in the trash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Permanently delete an owned private template without deleting created projects.
      requestBody:
        description: Optional revision guard; omitting the body deletes the current owned template.
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Template deleted; quota space released. Independent designs created from it remain intact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Template absent or owned by another account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Optional supplied revision does not match the current template revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /personal-templates/{id}/instantiate:
    parameters:
      - name: id
        in: path
        required: true
        description: Private template identifier owned by the current account.
        schema: { type: string }
    post:
      summary: Create an independent private design from an owned template snapshot.
      description: >-
        Uses the saved template pages, dimensions, kind, thumbnail, notes and application
        metadata; the original source project need not exist or remain accessible.
        The new design belongs to the current account and starts at project revision 1,
        with no members or public publications. Changes to the design and template are independent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Optional trimmed nonblank name without ASCII control characters; defaults to the template title.
      responses:
        "201":
          description: Independent editable project created. Response uses Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
        "400":
          description: Invalid project title or invalid saved template document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Template absent or owned by another account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
